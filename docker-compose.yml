services:

  postgres:
    image: postgres:15
    container_name: failsafe-postgres
    environment:
      POSTGRES_USER: failsafe
      POSTGRES_PASSWORD: failsafe
      POSTGRES_DB: failsafe
    ports:
      - "5432:5432"
    volumes:
      - ./internal/storage/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: .
    container_name: failsafe-backend
    depends_on:
      - postgres
    environment:
      DB_URL: postgres://failsafe:failsafe@postgres:5432/failsafe
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  docs:
    build: .
    container_name: failsafe-docs
    command: ["sh", "-c", "go run ./cmd/docs serve -port 8090"]
    ports:
      - "8090:8090"

  svc-a:
    image: nginx
    container_name: svc-a

  svc-b:
    image: nginx
    container_name: svc-b

  svc-c:
    image: nginx
    container_name: svc-c