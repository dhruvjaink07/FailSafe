name: Proto Generation Check

on:
  push:
    paths:
      - 'proto/**'
      - 'internal/Prod/**'
      - 'internal/proto/**'
  pull_request:
    paths:
      - 'proto/**'
      - 'internal/Prod/**'
      - 'internal/proto/**'

jobs:
  gen-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc-gen-go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install python grpc tools
        run: python -m pip install --user grpcio grpcio-tools

      - name: Generate Go proto files
        run: |
          protoc --go_out=. --go-grpc_out=. proto/infer.proto

      - name: Generate Python proto files
        run: |
          python -m grpc_tools.protoc -I. --python_out=internal/Prod --grpc_python_out=internal/Prod proto/infer.proto

      - name: Check for generated changes
        run: |
          git --no-pager status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "Proto-generated files are out of date. Regenerate and include them in your PR." >&2
            git --no-pager diff --name-only
            exit 1
          fi
