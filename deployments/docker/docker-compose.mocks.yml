version: '3.8'
services:
  api-gateway:
    image: hashicorp/http-echo:0.2.3
    container_name: api-gateway
    command: ["-text=api-gateway", "-listen=:8080"]
    ports:
      - "8080:8080"
  user-service:
    image: hashicorp/http-echo:0.2.3
    container_name: user-service
    command: ["-text=user-service", "-listen=:8081"]
    ports:
      - "8081:8081"
  order-service:
    image: hashicorp/http-echo:0.2.3
    container_name: order-service
    command: ["-text=order-service", "-listen=:8082"]
    ports:
      - "8082:8082"
  payment-service:
    image: hashicorp/http-echo:0.2.3
    container_name: payment-service
    command: ["-text=payment-service", "-listen=:8083"]
    ports:
      - "8083:8083"
  inventory-service:
    image: hashicorp/http-echo:0.2.3
    container_name: inventory-service
    command: ["-text=inventory-service", "-listen=:8084"]
    ports:
      - "8084:8084"
  shipping-service:
    image: hashicorp/http-echo:0.2.3
    container_name: shipping-service
    command: ["-text=shipping-service", "-listen=:8085"]
    ports:
      - "8085:8085"
  notification-service:
    image: hashicorp/http-echo:0.2.3
    container_name: notification-service
    command: ["-text=notification-service", "-listen=:8086"]
    ports:
      - "8086:8086"
  recommendation-service:
    image: hashicorp/http-echo:0.2.3
    container_name: recommendation-service
    command: ["-text=recommendation-service", "-listen=:8087"]
    ports:
      - "8087:8087"
